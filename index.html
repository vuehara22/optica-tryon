<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Óptica Vision – Prueba Virtual</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f1e8;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      color: #2c2c2c;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #555;
    }

    /* CONTENEDOR */
    .tryon-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      height: 360px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background: black;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* BOTONES */
    .models {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .models button {
      border: none;
      padding: 10px 14px;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    .models button.active {
      background: #000;
      outline: 2px solid #aaa;
    }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Óptica Vision</h1>
    <p>Probá tus anteojos en tiempo real</p>
  </div>

  <div class="tryon-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="models">
    <button class="active" onclick="setModel(0)">Modelo 1</button>
    <button onclick="setModel(1)">Modelo 2</button>
    <button onclick="setModel(2)">Modelo 3</button>
  </div>

  <div id="hint">Mové la cabeza 👓</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    /* === MODELOS === */
    const glassesModels = [
      { src: "glasses.png", widthCm: 13 },
      { src: "glasses2.png", widthCm: 13.5 },
      { src: "glasses3.png", widthCm: 12.5 }
    ];

    const images = glassesModels.map(m => {
      const img = new Image();
      img.src = m.src;
      return img;
    });

    let currentModel = 0;

    function setModel(index) {
      currentModel = index;
      document.querySelectorAll(".models button").forEach((b,i)=>{
        b.classList.toggle("active", i === index);
      });
    }

    /* === FACE MESH === */
    const faceMesh = new FaceMesh({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(results => {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(video,0,0,canvas.width,canvas.height);

      if (!results.multiFaceLandmarks.length) return;

      const face = results.multiFaceLandmarks[0];
      const leftEye = face[33];
      const rightEye = face[263];
      const nose = face[168];

      const eyeDistancePx = Math.hypot(
        (leftEye.x - rightEye.x) * canvas.width,
        (leftEye.y - rightEye.y) * canvas.height
      );

      const DISTANCIA_PUPILAR_CM = 6.2;
      const SCALE_FINE_TUNE = 0.91;

      const pxPorCm = eyeDistancePx / DISTANCIA_PUPILAR_CM;
      const model = glassesModels[currentModel];
      const img = images[currentModel];

      if (!img.complete) return;

      const width = model.widthCm * pxPorCm * SCALE_FINE_TUNE;
      const height = width * (img.height / img.width);

      const eyeY = ((leftEye.y + rightEye.y) / 2) * canvas.height;
      const noseY = nose.y * canvas.height;
      const centerY = eyeY + (noseY - eyeY) * 0.35;
      const centerX = nose.x * canvas.width;

      ctx.drawImage(
        img,
        centerX - width / 2,
        centerY - height / 2,
        width,
        height
      );
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 640,
      height: 640
    });

    camera.start();
  </script>

</body>
</html>
